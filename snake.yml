name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate matching teal animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shaswata28
          outputs: |
            dist/github-snake.svg?color_snake=#14B8A6&color_dots=#EBEDF0,#D6F5F0,#A3E6DC,#55CBB9,#14B8A6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#14B8A6&color_dots=#161B22,#123C38,#185E56,#168B7D,#14B8A6
      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
