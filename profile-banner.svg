<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shaswata Das — Software Engineer and Applied AI Researcher</title>
  <desc id="desc">Minimal navy developer profile banner with mint accents and a geometric systems motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ae0c3"/>
      <stop offset="1" stop-color="#98bdf9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity=".032" stroke-width="1"/>
    </pattern>
    <clipPath id="cut"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cut)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="222" height="5" fill="url(#accent)"/>
    <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#324058" stroke-opacity=".8" stroke-width="2"/>
    <text x="65" y="69" fill="#7ae0c3" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="3">SOFTWARE ENGINEER  /  APPLIED AI</text>
    <text x="62" y="152" fill="#f4f7fb" font-size="72" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-2.5">Shaswata Das</text>
    <text x="65" y="206" fill="#b6c5d8" font-size="23" font-family="Arial, Helvetica, sans-serif">Building useful software,</text>
    <text x="65" y="237" fill="#b6c5d8" font-size="23" font-family="Arial, Helvetica, sans-serif">from products to intelligent systems.</text>
    <line x1="65" y1="275" x2="733" y2="275" stroke="#50617a" stroke-opacity=".55"/>
    <text x="65" y="299" fill="#9aacc4" font-size="14" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">FULL-STACK</text>
    <circle cx="190" cy="295" r="2" fill="#7ae0c3"/>
    <text x="209" y="299" fill="#9aacc4" font-size="14" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">MOBILE</text>
    <circle cx="299" cy="295" r="2" fill="#7ae0c3"/>
    <text x="319" y="299" fill="#9aacc4" font-size="14" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">FEDERATED LEARNING</text>
    <!-- Restrained geometric system motif -->
    <g fill="none" stroke-width="2">
      <circle cx="1032" cy="158" r="117" stroke="#89adcc" stroke-opacity=".10"/>
      <circle cx="1032" cy="158" r="76" stroke="#89adcc" stroke-opacity=".11"/>
      <path d="M855 97 L943 124 L1045 83 L1132 152 L1062 227 L946 210 L855 97 Z" stroke="#7594b4" stroke-opacity=".28"/>
      <path d="M943 124 L946 210 L1045 83 L1062 227 L1132 152" stroke="#7ae0c3" stroke-opacity=".42"/>
      <path d="M943 124 L1132 152 M855 97 L1062 227" stroke="#7594b4" stroke-opacity=".18"/>
    </g>
    <g fill="#10243a" stroke="#a5b7ce" stroke-opacity=".7" stroke-width="2">
      <circle cx="855" cy="97" r="8"/>
      <circle cx="943" cy="124" r="9"/>
      <circle cx="1045" cy="83" r="8"/>
      <circle cx="1132" cy="152" r="8"/>
      <circle cx="1062" cy="227" r="9"/>
      <circle cx="946" cy="210" r="8"/>
    </g>
    <g fill="#7ae0c3">
      <circle cx="943" cy="124" r="3"/>
      <circle cx="1062" cy="227" r="3"/>
      <circle cx="1045" cy="83" r="3"/>
    </g>
  </g>
</svg>
